<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12121f">
<title>Vision Player — detections</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: dark; }
body {
    font-family: 'Segoe UI', sans-serif;
    background: #12121f; color: #e0e0e0;
    display: flex; flex-direction: column; height: 100dvh;
    overflow: hidden; gap: 8px; padding: 10px;
}
h1 { font-size: 15px; font-weight: 600; color: #6ab0ff; }
.bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #1c1c30; border-radius: 8px; padding: 8px 14px; flex-shrink: 0;
}
button, select {
    background: #2a2a4a; color: #cdd; border: 1px solid #3a3a5a;
    border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px;
    transition: background-color .15s;
}
button:hover:not(:disabled) { background: #3a3a6a; }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid #5c8ee8; outline-offset: 2px;
}
select { padding: 4px 6px; font-size: 12px; }
a { color: #6ab0ff; }

#main { display: flex; gap: 10px; flex: 1; min-height: 0; }

#stage {
    position: relative; flex: 1; min-width: 0;
    background: #0b0b14; border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
#wrap { position: relative; line-height: 0; max-width: 100%; max-height: 100%; }
video { display: block; max-width: 100%; max-height: 100%; background: #000; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

#side {
    width: 280px; flex-shrink: 0; background: #1c1c30; border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto;
}
#side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #7a7a9a; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.stats dt { color: #9a9ab0; }
.stats dd { font-family: monospace; color: #6ab0ff; text-align: right; font-weight: 600; }
label.opt { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
label.opt input { accent-color: #5c8ee8; width: 15px; height: 15px; }
.slider { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #9a9ab0; margin-top: 6px; }
.slider input { accent-color: #5c8ee8; width: 100%; }
#track-list { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-family: monospace; }
.track-row { display: flex; align-items: center; gap: 7px; padding: 2px 4px; border-radius: 4px; flex-wrap: wrap; }
.track-row .items { color: #ffd166; font-size: 11px; }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
#status { font-size: 12px; color: #9a9ab0; }
#status.error { color: #ff8080; }
#time { font-family: monospace; font-size: 15px; color: #6ab0ff; min-width: 96px; }
@media (max-width: 820px) {
    #main { flex-direction: column; }
    #side { width: auto; max-height: 40vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="bar">
    <h1>Vision Player</h1>
    <label for="video-select" style="font-size:12px;color:#9a9ab0">Video</label>
    <select id="video-select" aria-label="Source video"></select>
    <button id="play">Play</button>
    <button id="back" title="Back one sampled frame">&#8592; frame</button>
    <button id="fwd" title="Forward one sampled frame">frame &#8594;</button>
    <span id="time">0.00 / 0.00 s</span>
    <span id="status" role="status"></span>
    <span style="margin-left:auto"></span>
</div>

<div id="main">
    <div id="stage">
        <div id="wrap">
            <video id="video" playsinline preload="auto"></video>
            <canvas id="overlay" aria-hidden="true"></canvas>
        </div>
    </div>

    <aside id="side">
        <div>
            <h2>Now</h2>
            <dl class="stats">
                <dt>People in frame</dt><dd id="s-now">0</dd>
                <dt>Avg confidence</dt><dd id="s-conf">–</dd>
                <dt>Objects in frame</dt><dd id="s-obj-now">0</dd>
                <dt>Feet estimated</dt><dd id="s-est-now">0</dd>
                <dt>Sampled at</dt><dd id="s-frame">–</dd>
            </dl>
        </div>
        <div>
            <h2>Whole video</h2>
            <dl class="stats">
                <dt>Detections</dt><dd id="s-det">0</dd>
                <dt>Track IDs</dt><dd id="s-tracks">0</dd>
                <dt>Max in frame</dt><dd id="s-max">0</dd>
                <dt>Sample rate</dt><dd id="s-rate">–</dd>
                <dt>Feet estimated</dt><dd id="s-est">–</dd>
                <dt>Object detections</dt><dd id="s-obj">–</dd>
                <dt>Tracks with objects</dt><dd id="s-obj-tracks">–</dd>
            </dl>
        </div>
        <div>
            <h2>Objects seen</h2>
            <div id="object-list" class="stats"></div>
        </div>
        <div>
            <h2>Overlay</h2>
            <label class="opt"><input type="checkbox" id="o-box" checked> Boxes</label>
            <label class="opt"><input type="checkbox" id="o-id" checked> Track ID + confidence</label>
            <label class="opt"><input type="checkbox" id="o-trail" checked> Movement trails</label>
            <label class="opt"><input type="checkbox" id="o-foot" checked> Floor points <span style="color:#7a7a9a">(hollow = estimated)</span></label>
            <label class="opt"><input type="checkbox" id="o-skel"> Skeleton</label>
            <label class="opt"><input type="checkbox" id="o-obj" checked> Held objects</label>
            <label class="opt" style="padding-left:23px"><input type="checkbox" id="o-obj-loose"> …also unheld (on shelves)</label>
            <div class="slider">
                <label for="o-minconf">Min confidence <span id="v-minconf">0.15</span></label>
                <input type="range" id="o-minconf" min="0.1" max="0.9" step="0.05" value="0.15">
            </div>
            <div class="slider">
                <label for="o-trailsec">Trail length <span id="v-trailsec">4</span>s</label>
                <input type="range" id="o-trailsec" min="1" max="20" step="1" value="4">
            </div>
        </div>
        <div>
            <h2>Visible tracks</h2>
            <div id="track-list"></div>
        </div>
    </aside>
</div>

<script>
const video  = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx    = canvas.getContext('2d');
const $      = id => document.getElementById(id);
const KP_VISIBLE = 0.3;   // keypoint confidence that counts as visible (see detector.py)

let frames   = [];          // [{t, dets:[{id,x1,y1,x2,y2,conf,fx,fy}]}] sorted by t
let trails   = new Map();   // track_id -> [{t,x,y,conf}]
let objects  = new Map();   // time_s -> [{label,conf,x1,y1,x2,y2,pid}]
let heldBy   = new Map();   // track_id -> {label: frames}
let sampleDt = 0.25;        // seconds between sampled frames

const status = (msg, isError) => {
    $('status').textContent = msg;
    $('status').classList.toggle('error', !!isError);
};

// Stable, well-separated colour per track id
const colorOf = id => 'hsl(' + ((id * 47) % 360) + ' 85% 62%)';

// ── data loading ──────────────────────────────────────────────────────────
async function loadVideoList() {
    const list = await (await fetch('/api/vision/videos')).json();
    const sel = $('video-select');
    sel.innerHTML = '';
    for (const v of list) {
        const o = document.createElement('option');
        o.value = v.id;
        o.textContent = v.id + ' (' + v.size_mb + ' MB' + (v.has_tracks ? ', tracked' : ', no tracks') + ')';
        sel.appendChild(o);
    }
    if (!list.length) { status('No videos in data/videos — run download_video.py', true); return; }
    sel.value = list[0].id;
    await load(list[0].id);
}

function parseTracks(csv) {
    const lines = csv.trim().split('\n');
    const head  = lines[0].trim().split(',');
    const ix    = Object.fromEntries(head.map((h, i) => [h, i]));
    const byTime = new Map();
    trails = new Map();
    let detCount = 0, estCount = 0;

    for (let i = 1; i < lines.length; i++) {
        const p = lines[i].trim().split(',');
        if (p.length < head.length) continue;
        const t  = +p[ix.time_s];
        const id = +p[ix.track_id];
        const d  = {
            id: id, conf: +p[ix.conf],
            x1: +p[ix.x1], y1: +p[ix.y1], x2: +p[ix.x2], y2: +p[ix.y2],
            fx: +p[ix.foot_x], fy: +p[ix.foot_y],
            src: ix.foot_src === undefined ? 'box' : p[ix.foot_src],
            // 17 COCO keypoints "x:y:conf;…" → [[x,y,c],…]
            kp: ix.keypoints === undefined || !p[ix.keypoints] ? null
                : p[ix.keypoints].split(';').map(s => s.split(':').map(Number)),
        };
        if (d.src !== 'box') estCount++;
        if (!byTime.has(t)) byTime.set(t, []);
        byTime.get(t).push(d);
        if (!trails.has(id)) trails.set(id, []);
        trails.get(id).push({ t: t, x: d.fx, y: d.fy, conf: d.conf });
        detCount++;
    }

    frames = [...byTime.entries()].sort((a, b) => a[0] - b[0])
                                  .map(e => ({ t: e[0], dets: e[1] }));
    sampleDt = frames.length > 1 ? frames[1].t - frames[0].t : 0.25;

    const maxIn = frames.reduce((m, f) => Math.max(m, f.dets.length), 0);
    $('s-det').textContent    = detCount.toLocaleString();
    $('s-tracks').textContent = trails.size;
    $('s-max').textContent    = maxIn;
    $('s-rate').textContent   = (1 / sampleDt).toFixed(1) + '/s';
    $('s-est').textContent    = detCount ? Math.round(100 * estCount / detCount) + '%' : '–';
}

function parseObjects(csv) {
    objects = new Map(); heldBy = new Map();
    const byLabel = new Map();
    let n = 0;
    const lines = csv.trim().split('\n');
    if (lines.length < 2) { renderObjectSummary(byLabel, 0); return; }
    const head = lines[0].trim().split(',');
    const ix   = Object.fromEntries(head.map((h, i) => [h, i]));
    for (let i = 1; i < lines.length; i++) {
        const p = lines[i].trim().split(',');      // trim: with CRLF the last column would carry a CR
        if (p.length < head.length) continue;
        const t = +p[ix.time_s];
        const o = {
            label: p[ix.label], conf: +p[ix.conf],
            x1: +p[ix.x1], y1: +p[ix.y1], x2: +p[ix.x2], y2: +p[ix.y2],
            pid: p[ix.person_id] === '' ? null : +p[ix.person_id],
        };
        if (!objects.has(t)) objects.set(t, []);
        objects.get(t).push(o);
        if (o.pid !== null) {
            if (!heldBy.has(o.pid)) heldBy.set(o.pid, {});
            const h = heldBy.get(o.pid);
            h[o.label] = (h[o.label] || 0) + 1;
            byLabel.set(o.label, (byLabel.get(o.label) || 0) + 1);
        }
        n++;
    }
    renderObjectSummary(byLabel, n);
}

function renderObjectSummary(byLabel, n) {
    $('s-obj').textContent = n ? n.toLocaleString() : '–';
    // a track counts as "carrying" something when seen with it in 3+ sampled frames
    $('s-obj-tracks').textContent = n
        ? [...heldBy.values()].filter(h => Object.values(h).reduce((a, b) => a + b, 0) >= 3).length
        : '–';
    const box = $('object-list');
    box.innerHTML = '';
    const rows = [...byLabel.entries()].sort((a, b) => b[1] - a[1]);
    if (!rows.length) {
        const dt = document.createElement('dt');
        dt.textContent = n ? 'nothing held' : 'no objects CSV for this video';
        box.appendChild(dt);
        return;
    }
    for (const [label, cnt] of rows) {
        const dt = document.createElement('dt'); dt.textContent = label;
        const dd = document.createElement('dd'); dd.textContent = cnt;
        box.append(dt, dd);
    }
}

// what a track was mostly seen holding, e.g. "shopping bag ×12"
function heldLabel(id) {
    const h = heldBy.get(id);
    if (!h) return '';
    return Object.entries(h).sort((a, b) => b[1] - a[1]).slice(0, 2)
        .map(([l, c]) => l + ' ×' + c).join(', ');
}

async function load(id) {
    frames = []; trails = new Map(); objects = new Map(); heldBy = new Map();
    video.src = '/api/vision/video/' + id;
    status('loading tracks…');
    try {
        const [res, objRes] = await Promise.all([
            fetch('/api/vision/tracks/' + id),
            fetch('/api/vision/objects/' + id).catch(() => null),
        ]);
        if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.error || res.statusText);
        }
        parseTracks(await res.text());
        parseObjects(objRes && objRes.ok ? await objRes.text() : '');
        status(frames.length + ' annotated frames' + (objects.size ? ', with objects' : ''));
    } catch (e) {
        status(String(e.message || e), true);
    }
}

// ── drawing ───────────────────────────────────────────────────────────────
function frameAt(t) {
    if (!frames.length) return null;
    let lo = 0, hi = frames.length - 1;
    while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (frames[mid].t <= t) lo = mid; else hi = mid - 1;
    }
    // snap to the nearer of the two neighbouring samples
    const a = frames[lo], b = frames[Math.min(lo + 1, frames.length - 1)];
    return Math.abs(b.t - t) < Math.abs(t - a.t) ? b : a;
}

function draw() {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w) return;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    ctx.clearRect(0, 0, w, h);

    $('time').textContent = video.currentTime.toFixed(2) + ' / ' + (video.duration || 0).toFixed(2) + ' s';

    const f = frameAt(video.currentTime);
    if (!f) return;

    const minConf   = +$('o-minconf').value;
    const trailSec  = +$('o-trailsec').value;
    const showBox   = $('o-box').checked,   showId   = $('o-id').checked;
    const showTrail = $('o-trail').checked, showFoot = $('o-foot').checked;
    const showObj   = $('o-obj').checked,   showLoose = $('o-obj-loose').checked;
    const showSkel  = $('o-skel').checked;
    const dets = f.dets.filter(d => d.conf >= minConf);
    const visibleIds = new Set(dets.map(d => d.id));
    const objs = showObj
        ? (objects.get(f.t) || []).filter(o => o.pid !== null ? visibleIds.has(o.pid) : showLoose)
        : [];

    const scale = w / 1280;                    // keep strokes/text readable at any resolution
    ctx.lineWidth = Math.max(2, 2.5 * scale);
    ctx.font = '600 ' + Math.round(17 * scale) + "px 'Segoe UI', sans-serif";
    ctx.textBaseline = 'bottom';
    ctx.lineJoin = 'round';

    for (const d of dets) {
        const c = colorOf(d.id);

        if (showTrail) {
            const pts = (trails.get(d.id) || []).filter(p => p.t <= f.t && p.t >= f.t - trailSec);
            if (pts.length > 1) {
                ctx.strokeStyle = c; ctx.globalAlpha = 0.55;
                ctx.beginPath();
                pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }
        if (showBox) {
            ctx.strokeStyle = c;
            ctx.strokeRect(d.x1, d.y1, d.x2 - d.x1, d.y2 - d.y1);
        }
        if (showSkel && d.kp) drawSkeleton(d.kp, c, scale);
        if (showFoot) {
            if (d.src === 'box') {
                ctx.fillStyle = c;
                ctx.beginPath();
                ctx.ellipse(d.fx, d.fy, 7 * scale, 3.5 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // estimated: dashed drop from the visible bottom to the guessed feet, hollow marker
                ctx.strokeStyle = c;
                ctx.setLineDash([4 * scale, 4 * scale]);
                ctx.beginPath(); ctx.moveTo(d.fx, d.y2); ctx.lineTo(d.fx, d.fy); ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.ellipse(d.fx, d.fy, 7 * scale, 3.5 * scale, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        if (showId) {
            const label = '#' + d.id + '  ' + d.conf.toFixed(2);
            const tw = ctx.measureText(label).width;
            const th = 22 * scale;
            const ly = Math.max(th, d.y1);
            ctx.fillStyle = c;
            ctx.fillRect(d.x1, ly - th, tw + 10 * scale, th);
            ctx.fillStyle = '#101018';
            ctx.fillText(label, d.x1 + 5 * scale, ly - 4 * scale);
        }
    }

    // held objects: dashed box in the holder's colour, label underneath; unheld
    // ones (shelf stock, floor) in grey
    if (objs.length) {
        ctx.font = '600 ' + Math.round(14 * scale) + "px 'Segoe UI', sans-serif";
        ctx.setLineDash([6 * scale, 4 * scale]);
        ctx.lineWidth = Math.max(1.5, 2 * scale);
        for (const o of objs) {
            const c = o.pid !== null ? colorOf(o.pid) : '#9a9ab0';
            ctx.strokeStyle = c;
            ctx.strokeRect(o.x1, o.y1, o.x2 - o.x1, o.y2 - o.y1);
            const label = o.label + ' ' + o.conf.toFixed(2);
            const tw = ctx.measureText(label).width, th = 18 * scale;
            const ly = Math.min(h, o.y2 + th);
            ctx.fillStyle = c;
            ctx.fillRect(o.x1, ly - th, tw + 8 * scale, th);
            ctx.fillStyle = '#101018';
            ctx.fillText(label, o.x1 + 4 * scale, ly - 3 * scale);
        }
        ctx.setLineDash([]);
    }

    // ── side panel ──
    $('s-now').textContent   = dets.length;
    $('s-est-now').textContent = dets.filter(d => d.src !== 'box').length;
    $('s-obj-now').textContent = objs.filter(o => o.pid !== null).length;
    $('s-conf').textContent  = dets.length
        ? (dets.reduce((s, d) => s + d.conf, 0) / dets.length).toFixed(2) : '–';
    $('s-frame').textContent = f.t.toFixed(2) + 's';

    const list = $('track-list');
    list.innerHTML = '';
    for (const d of [...dets].sort((a, b) => a.id - b.id)) {
        const pts = trails.get(d.id) || [];
        const seen = pts.length ? (pts[pts.length - 1].t - pts[0].t).toFixed(1) : '0.0';
        const row = document.createElement('div');
        row.className = 'track-row';
        const sw = document.createElement('span');
        sw.className = 'swatch';
        sw.style.background = colorOf(d.id);
        row.appendChild(sw);
        const txt = document.createElement('span');
        txt.textContent = '#' + d.id;
        row.appendChild(txt);
        const meta = document.createElement('span');
        meta.style.color = '#7a7a9a';
        meta.textContent = 'tracked ' + seen + 's' + (d.src !== 'box' ? ' · feet ' + d.src : '');
        row.appendChild(meta);
        const held = heldLabel(d.id);
        if (held) {
            const it = document.createElement('span');
            it.className = 'items';
            it.textContent = '· ' + held;
            row.appendChild(it);
        }
        list.appendChild(row);
    }
}

// COCO-17 limbs, for the optional skeleton overlay
const LIMBS = [[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16],[0,5],[0,6]];
function drawSkeleton(kp, c, scale) {
    ctx.save();
    ctx.strokeStyle = c; ctx.fillStyle = c; ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1.5, 2 * scale);
    for (const [a, b] of LIMBS) {
        if (kp[a][2] < KP_VISIBLE || kp[b][2] < KP_VISIBLE) continue;
        ctx.beginPath(); ctx.moveTo(kp[a][0], kp[a][1]); ctx.lineTo(kp[b][0], kp[b][1]); ctx.stroke();
    }
    for (const [x, y, v] of kp) {
        if (v < KP_VISIBLE) continue;
        ctx.beginPath(); ctx.arc(x, y, 3 * scale, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

// Redraw on every rendered video frame where supported, else on rAF.
if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
    const step = () => { draw(); video.requestVideoFrameCallback(step); };
    video.requestVideoFrameCallback(step);
} else {
    const step = () => { draw(); requestAnimationFrame(step); };
    requestAnimationFrame(step);
}
video.addEventListener('seeked', draw);
video.addEventListener('loadeddata', () => {
    // deep link: /vision#t=40 opens at 40 s
    const m = /t=([\d.]+)/.exec(location.hash);
    if (m) video.currentTime = +m[1];
    draw();
});

// ── controls ──────────────────────────────────────────────────────────────
const toggle = () => video.paused ? video.play() : video.pause();
const stepFrame = dir => {
    video.pause();
    video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + dir * sampleDt));
};

$('play').addEventListener('click', toggle);
video.addEventListener('play',  () => $('play').textContent = 'Pause');
video.addEventListener('pause', () => $('play').textContent = 'Play');
$('back').addEventListener('click', () => stepFrame(-1));
$('fwd').addEventListener('click',  () => stepFrame(+1));
$('video-select').addEventListener('change', e => load(e.target.value));

for (const id of ['o-box', 'o-id', 'o-trail', 'o-foot', 'o-skel', 'o-obj', 'o-obj-loose']) $(id).addEventListener('change', draw);
$('o-minconf').addEventListener('input', e => { $('v-minconf').textContent = e.target.value; draw(); });
$('o-trailsec').addEventListener('input', e => { $('v-trailsec').textContent = e.target.value; draw(); });

document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, button, a')) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(+1); }
    else if (e.key === 'ArrowLeft')  { e.preventDefault(); stepFrame(-1); }
});

loadVideoList();
</script>
</body>
</html>
